# Compose del proyecto awr.
# El archivo original estaba en C:\Users\Jeff\Desktop\awr y ya no existe.
# awr_postgres_data es el volumen existente: no eliminarlo.

name: awr

services:
  postgres:
    image: postgres:18
    container_name: awr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: awr_db
      POSTGRES_USER: awr_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - awr_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awr_user -d awr_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - awr

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy
    container_name: awr_toxiproxy
    restart: unless-stopped
    command: ["--host=0.0.0.0", "--config=/toxiproxy.json"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8474:8474"
      - "15433:15433"
    volumes:
      - ./tools/toxiproxy/toxiproxy.json:/toxiproxy.json:ro
    networks:
      - awr

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.4
    container_name: awr_redpanda
    hostname: redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://127.0.0.1:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://127.0.0.1:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:9644:9644"
    volumes:
      - awr_redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9644/v1/status/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - awr

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: awr_clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - awr_clickhouse_data:/var/lib/clickhouse
      - ./tools/clickhouse/powerbi-reader.xml:/etc/clickhouse-server/users.d/powerbi-reader.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - awr

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.12.0
    container_name: awr_redpanda_console
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml
        exec /app/console
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - awr

networks:
  awr:
    name: awr_default
    external: true

volumes:
  awr_postgres_data:
    external: true
    name: awr_postgres_data
  awr_redpanda_data:
    name: awr_redpanda_data
  awr_clickhouse_data:
    name: awr_clickhouse_data
